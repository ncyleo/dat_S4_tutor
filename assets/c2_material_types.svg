<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" role="img">
  <rect width="460" height="200" fill="#f8fafc"/>
  <text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">物料三大類</text>
  <g font-family="sans-serif">
    <rect x="20" y="45" width="130" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="85" y="75" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">天然</text>
    <text x="85" y="100" text-anchor="middle" font-size="11" fill="#334155">木 · 天然橡膠</text>
    <text x="85" y="120" text-anchor="middle" font-size="11" fill="#334155">部分金屬礦</text>
