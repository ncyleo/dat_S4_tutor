<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-label="模型種類">
  <rect width="420" height="160" fill="#f8fafc"/>
  <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">模型種類（精簡）</text>
  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="20" y="50" width="85" height="55" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="62" y="82" fill="#92400e">紙／紙板</text>
    <rect x="120" y="50" width="85" height="55" rx="6" fill="#e0e7ff" stroke="#4f46e5"/><text x="162" y="82" fill="#312e81">發泡膠</text>
    <rect x="220" y="50" width="85" height="55" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="262" y="82" fill="#14532d">塑料等</text>
    <rect x="320" y="50" width="85" height="55" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="362" y="75" fill="#1e3a8a">電腦／</text><text x="362" y="92" fill="#1e3a8a">數碼模塑</text>
  </g>
  <text x="210" y="140" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">用途：測比例、測手感、減少平面圖誤解</text>
</svg>
