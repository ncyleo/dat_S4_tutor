<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="構成與重複漸變">
  <rect width="480" height="200" fill="#f8fafc"/>
  <text x="240" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">構成：結構線 · 重複 · 漸變</text>
  <!-- grid structure -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="30" y1="50" x2="150" y2="50"/><line x1="30" y1="90" x2="150" y2="90"/><line x1="30" y1="130" x2="150" y2="130"/>
    <line x1="30" y1="50" x2="30" y2="130"/><line x1="90" y1="50" x2="90" y2="130"/><line x1="150" y1="50" x2="150" y2="130"/>
  </g>
  <rect x="40" y="60" width="40" height="20" fill="#60a5fa"/>
  <rect x="100" y="100" width="40" height="20" fill="#2563eb"/>
  <text x="90" y="155" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">結構線網格</text>
  <!-- repeat -->
  <circle cx="210" cy="80" r="14" fill="#38bdf8"/><circle cx="250" cy="80" r="14" fill="#38bdf8"/><circle cx="290" cy="80" r="14" fill="#38bdf8"/>
  <text x="250" y="120" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">重複</text>
  <!-- gradient sizes -->
  <circle cx="360" cy="95" r="8" fill="#818cf8"/>
  <circle cx="395" cy="90" r="14" fill="#6366f1"/>
  <circle cx="440" cy="82" r="22" fill="#4f46e5"/>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">漸變（大小）</text>
  <text x="240" y="185" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">均衡＝視覺重量大致穩；不均衡＝故意偏向一邊</text>
</svg>
