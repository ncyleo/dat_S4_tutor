    <circle cx="210" cy="55" r="12"/><line x1="210" y1="67" x2="210" y2="145"/><line x1="210" y1="90" x2="180" y2="115"/><line x1="210" y1="90" x2="240" y2="115"/><line x1="210" y1="145" x2="185" y2="185"/><line x1="210" y1="145" x2="235" y2="185"/>
