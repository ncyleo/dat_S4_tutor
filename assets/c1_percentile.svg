  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">95%</text>
  <line x1="40" y1="195" x2="380" y2="195" stroke="#94a3b8" stroke-dasharray="4 3"/>
