<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="設計摘要">
  <rect width="420" height="180" fill="#f8fafc"/>
  <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">設計摘要／規格（清單思維）</text>
  <rect x="50" y="45" width="320" height="110" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="70" y="70" font-size="12" fill="#1e3a8a" font-family="sans-serif" font-weight="700">設計摘要應講清：</text>
  <text x="70" y="92" font-size="12" fill="#334155" font-family="sans-serif">• 用家係邊個？要解決咩問題？</text>
  <text x="70" y="112" font-size="12" fill="#334155" font-family="sans-serif">• 限制／環境／安全？成功準則？</text>
  <text x="70" y="132" font-size="12" fill="#334155" font-family="sans-serif">• 提供資料，唔直接塞答案</text>
</svg>
