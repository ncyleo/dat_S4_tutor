<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="設計過程">
  <rect width="520" height="160" fill="#f8fafc"/>
  <text x="260" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">設計過程（精簡流程）</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <rect x="10" y="50" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="45" y="75" fill="#1e3a8a">摘要</text>
    <rect x="100" y="50" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="75" fill="#1e3a8a">研究</text>
    <rect x="190" y="50" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="225" y="75" fill="#1e3a8a">分析</text>
    <rect x="280" y="50" width="70" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a"/><text x="315" y="75" fill="#14532d">概念化</text>
    <rect x="370" y="50" width="70" height="40" rx="6" fill="#bbf7d0" stroke="#16a34a"/><text x="405" y="75" fill="#14532d">實踐</text>
    <rect x="450" y="50" width="60" height="40" rx="6" fill="#fde68a" stroke="#d97706"/><text x="480" y="75" fill="#92400e">評鑑</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="80" y1="70" x2="98" y2="70"/><line x1="170" y1="70" x2="188" y2="70"/>
    <line x1="260" y1="70" x2="278" y2="70"/><line x1="350" y1="70" x2="368" y2="70"/>
    <line x1="440" y1="70" x2="448" y2="70"/>
  </g>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">可來回修改；評鑑可回饋到較早步驟</text>
</svg>
