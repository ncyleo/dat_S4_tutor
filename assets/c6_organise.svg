<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="組織原理五項">
  <rect width="520" height="240" fill="#f8fafc"/>
  <text x="260" y="20" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">組織原理（示意）</text>
  <!-- symmetry -->
  <g transform="translate(20,40)">
    <rect x="0" y="0" width="90" height="70" fill="#fff" stroke="#94a3b8"/>
    <line x1="45" y1="5" x2="45" y2="65" stroke="#ef4444" stroke-dasharray="3 2"/>
    <rect x="10" y="20" width="20" height="30" fill="#3b82f6"/>
    <rect x="60" y="20" width="20" height="30" fill="#3b82f6"/>
    <text x="45" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#334155">對稱平衡</text>
  </g>
  <!-- asymmetric -->
  <g transform="translate(130,40)">
    <rect x="0" y="0" width="90" height="70" fill="#fff" stroke="#94a3b8"/>
    <rect x="8" y="15" width="35" height="40" fill="#93c5fd"/>
    <circle cx="72" cy="45" r="12" fill="#f59e0b"/>
    <text x="45" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#334155">不對稱平衡</text>
  </g>
  <!-- unity -->
  <g transform="translate(240,40)">
    <rect x="0" y="0" width="90" height="70" fill="#fff" stroke="#94a3b8"/>
    <rect x="10" y="18" width="22" height="22" fill="#22c55e" opacity=".85"/>
    <circle cx="52" cy="35" r="12" fill="#22c55e" opacity=".7"/>
    <polygon points="70,50 88,50 79,28" fill="#22c55e" opacity=".55"/>
    <text x="45" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#334155">統一性</text>
  </g>
  <!-- focus -->
  <g transform="translate(350,40)">
    <rect x="0" y="0" width="90" height="70" fill="#fff" stroke="#94a3b8"/>
    <circle cx="25" cy="35" r="8" fill="#cbd5e1"/>
    <circle cx="48" cy="35" r="8" fill="#cbd5e1"/>
    <circle cx="70" cy="35" r="14" fill="#ef4444"/>
    <text x="45" y="90" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#334155">焦點</text>
  </g>
  <!-- rhythm -->
  <g transform="translate(100,145)">
    <rect x="0" y="0" width="320" height="55" fill="#fff" stroke="#94a3b8"/>
    <rect x="20" y="30" width="20" height="15" fill="#6366f1"/>
    <rect x="55" y="22" width="20" height="23" fill="#6366f1"/>
    <rect x="90" y="14" width="20" height="31" fill="#6366f1"/>
    <rect x="125" y="8" width="20" height="37" fill="#6366f1"/>
    <rect x="170" y="30" width="20" height="15" fill="#a78bfa"/>
    <rect x="205" y="22" width="20" height="23" fill="#a78bfa"/>
    <rect x="240" y="14" width="20" height="31" fill="#a78bfa"/>
    <rect x="275" y="8" width="20" height="37" fill="#a78bfa"/>
    <text x="160" y="72" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#334155">節奏／韻律（重複＋有規律變化）</text>
  </g>
</svg>
