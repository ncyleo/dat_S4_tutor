<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="正投影與等角">
  <rect width="480" height="200" fill="#f8fafc"/>
  <text x="240" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">視像表達：正投影 · 等角 · 草圖</text>
  <!-- ortho three views -->
  <g transform="translate(30,50)" stroke="#334155" fill="none" stroke-width="2">
    <rect x="0" y="0" width="50" height="40"/><text x="25" y="55" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif" stroke="none">前視</text>
    <rect x="70" y="0" width="30" height="40"/><text x="85" y="55" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif" stroke="none">側視</text>
    <rect x="20" y="70" width="50" height="30"/><text x="45" y="115" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif" stroke="none">俯視</text>
  </g>
  <text x="90" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="sans-serif">正投影（多視圖）</text>
  <!-- isometric box -->
  <g transform="translate(220,55)" stroke="#1d4ed8" fill="#bfdbfe" stroke-width="2">
    <polygon points="40,10 90,35 40,60 -10,35"/>
    <polygon points="-10,35 40,60 40,110 -10,85" fill="#93c5fd"/>
    <polygon points="40,60 90,35 90,85 40,110" fill="#60a5fa"/>
  </g>
  <text x="260" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="sans-serif">等角投影</text>
  <!-- sketch -->
  <g transform="translate(360,60)" stroke="#64748b" fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M10,80 Q30,10 55,40 Q70,60 90,30"/>
    <path d="M20,90 L50,50 L80,85" stroke-dasharray="3 2"/>
  </g>
  <text x="410" y="175" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="sans-serif">草圖意念</text>
</svg>
