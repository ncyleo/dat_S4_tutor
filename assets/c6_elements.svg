<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="點線面體">
  <rect width="480" height="200" fill="#f8fafc"/>
  <text x="240" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">視覺設計元素：點 → 線 → 面 → 體</text>
  <circle cx="55" cy="100" r="8" fill="#2563eb"/>
  <text x="55" y="145" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">點</text>
  <path d="M100 100 H170" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="135" y="145" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">線</text>
  <rect x="200" y="70" width="70" height="55" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="235" y="145" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">面</text>
  <g transform="translate(330,55)">
    <polygon points="40,10 90,35 90,85 40,110 0,85 0,35" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
    <line x1="40" y1="10" x2="40" y2="60" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="40" y2="60" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="90" y1="35" x2="40" y2="60" stroke="#1e40af" stroke-width="1.5"/>
  </g>
  <text x="370" y="145" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">體積</text>
  <text x="240" y="180" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">幾何形較規律；有機形較流動、自然</text>
</svg>
