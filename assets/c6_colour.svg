<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="色環與對比">
  <rect width="420" height="220" fill="#f8fafc"/>
  <text x="210" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">色環概念 · 互補／對比（簡）</text>
  <!-- simple 6-segment wheel -->
  <g transform="translate(130,120)">
    <path d="M0,0 L0,-55 A55,55 0 0,1 47.6,-27.5 Z" fill="#ef4444"/>
    <path d="M0,0 L47.6,-27.5 A55,55 0 0,1 47.6,27.5 Z" fill="#eab308"/>
    <path d="M0,0 L47.6,27.5 A55,55 0 0,1 0,55 Z" fill="#22c55e"/>
    <path d="M0,0 L0,55 A55,55 0 0,1 -47.6,27.5 Z" fill="#06b6d4"/>
    <path d="M0,0 L-47.6,27.5 A55,55 0 0,1 -47.6,-27.5 Z" fill="#3b82f6"/>
    <path d="M0,0 L-47.6,-27.5 A55,55 0 0,1 0,-55 Z" fill="#a855f7"/>
    <circle r="18" fill="#fff" stroke="#94a3b8"/>
  </g>
  <text x="130" y="195" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">簡化色環</text>
  <!-- complementary pair -->
  <rect x="260" y="70" width="50" height="50" fill="#ef4444" stroke="#334155"/>
  <rect x="330" y="70" width="50" height="50" fill="#22c55e" stroke="#334155"/>
  <text x="320" y="145" text-anchor="middle" font-size="12" fill="#334155" font-family="sans-serif">互補色對比（紅↔綠示意）</text>
  <text x="320" y="165" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">對比強 → 易成焦點</text>
</svg>
