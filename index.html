<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中四設計與應用科技科自學 · 三欄（DAT）</title>
<style>
:root {
  --bg: #eef2f7; --card: #fff; --ink: #1e293b; --muted: #64748b; --line: #dbe3ee;
  --primary: #1d4ed8; --ok: #059669; --bad: #dc2626; --side: #0f172a;
  --radius: 10px;
  --font: "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono: "JetBrains Mono","Cascadia Code","SF Mono",Consolas,monospace;
  --left-w: 250px; --right-w: 340px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: var(--bg); }
button, input { font: inherit; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
  padding: .55rem .85rem; background: linear-gradient(120deg,#0f172a,#1d4ed8); color: #fff;
}
.topbar h1 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 10rem; }
.topbar .tag { font-size: .78rem; opacity: .92; }
.topbar button {
  appearance: none; border: 0; border-radius: 6px; padding: .35rem .65rem;
  background: rgba(255,255,255,.18); color: #fff; font-weight: 700; cursor: pointer; font-size: .8rem;
}
.topbar button:hover { background: rgba(255,255,255,.28); }
.shell { display: flex; height: calc(100vh - 52px); min-height: 420px; }
.panel {
  background: var(--card); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0;
}
.panel.left { width: var(--left-w); flex-shrink: 0; background: var(--side); color: #e2e8f0; border-right-color: #1e293b; }
.panel.mid { flex: 1; border-right: 1px solid var(--line); }
.panel.right { width: var(--right-w); flex-shrink: 0; background: #f8fafc; }
body.hide-left .panel.left { display: none; }
body.hide-right .panel.right { display: none; }
.panel-h {
  padding: .55rem .75rem; font-size: .72rem; font-weight: 800; letter-spacing: .04em;
  text-transform: uppercase; border-bottom: 1px solid var(--line); color: var(--muted);
}
.panel.left .panel-h { color: #94a3b8; border-bottom-color: #334155; }
.panel-body { flex: 1; overflow: auto; padding: .65rem .75rem 1.2rem; }
#navList { display: flex; flex-direction: column; gap: .25rem; }
.nav-ch {
  font-size: .68rem; font-weight: 800; color: #64748b; letter-spacing: .04em;
  padding: .55rem .35rem .2rem; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: flex-start; gap: .45rem; width: 100%;
  appearance: none; border: 0; background: transparent; color: #cbd5e1;
  text-align: left; padding: .45rem .5rem; border-radius: 8px; cursor: pointer;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: #1e293b; color: #fff; }
.nav-item.active { background: #1e293b; color: #fff; border-left-color: #60a5fa; }
.nav-item .ord {
  flex-shrink: 0; width: 1.4rem; height: 1.4rem; border-radius: 999px;
  background: #334155; color: #93c5fd; font-size: .72rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
}
.nav-item .ttl { flex: 1; font-size: .82rem; font-weight: 650; line-height: 1.35; }
.nav-item .star { font-size: .72rem; color: #fbbf24; }
.nav-item.locked { opacity: .55; }
.nav-item .soon { font-size: .68rem; color: #94a3b8; }
.welcome h2 { margin-top: 0; }
.stem { font-size: 1.12rem; margin: 0 0 .55rem; line-height: 1.45; }
.pill { display: inline-block; background: #dbeafe; color: #1e40af; font-size: .7rem; font-weight: 700; padding: .1rem .4rem; border-radius: 999px; }
.teach { font-size: .95rem; line-height: 1.55; }
.teach p { margin: .4rem 0; }
.teach ul, .teach ol { margin: .3rem 0 .55rem; padding-left: 1.25rem; }
.kw { font-family: var(--mono); font-size: .86em; background: #dbeafe; color: #1e40af; padding: .05rem .3rem; border-radius: 3px; font-weight: 600; }
.obar {
  display: inline-block;
  border-top: 2px solid currentColor;
  padding: 0.02em 0.06em 0;
  margin: 0 0.02em;
  line-height: 1.1;
  vertical-align: baseline;
}
.tip { background: #fffbeb; border-left: 4px solid #f59e0b; padding: .55rem .75rem; margin: .65rem 0; font-size: .9rem; }
.koujue { background: #ecfdf5; border-left: 4px solid #10b981; padding: .55rem .75rem; margin: .65rem 0; font-size: .92rem; font-weight: 600; }
.gate-fig { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: .7rem 0; }
.gate-fig img { max-height: 100px; max-width: 100%; width: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: .35rem .5rem; cursor: zoom-in; }
.gate-meta { font-size: .9rem; }
.gate-meta .expr { font-family: var(--mono); font-size: 1.05rem; font-weight: 700; color: #1e3a8a; }
.truth-demo { width: 100%; max-width: 380px; border-collapse: collapse; font-size: .88rem; margin: .5rem 0; }
.truth-demo th, .truth-demo td { border: 1px solid #cbd5e1; padding: .35rem .55rem; text-align: center; }
.truth-demo th { background: #e2e8f0; }
.truth-demo td.f { background: #eff6ff; font-weight: 700; }
.fig { margin: .7rem 0; text-align: center; }
.fig img { max-width: 100%; max-height: min(420px, 55vh); width: auto; height: auto; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: .35rem; cursor: zoom-in; }
.fig-def { margin: .35rem 0 .55rem; text-align: center; }
.fig-def img { max-width: 100%; max-height: 140px; cursor: zoom-in; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: .25rem; }
.tryit { background: #eff6ff; border: 2px solid #93c5fd; border-radius: var(--radius); padding: .85rem 1rem; margin-top: .55rem; }
.tryit h3 { margin: 0 0 .45rem; color: #1e3a8a; font-size: 1.02rem; }
.tryit .try-note { font-size: .9rem; color: #1e40af; margin: 0 0 .5rem; }
.design-step { border: 1px solid #bfdbfe; background: #fff; border-radius: 8px; padding: .55rem .7rem; margin: .45rem 0; }
.design-step .step-lab { font-size: .72rem; font-weight: 800; color: #1d4ed8; margin-bottom: .25rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .4rem; margin: .55rem 0; }
.btn {
  appearance: none; border: 1px solid #94a3b8; background: #fff; color: var(--ink);
  border-radius: 8px; padding: .45rem .85rem; font-weight: 700; cursor: pointer; font-size: .86rem;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary, .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.ghost, .btn-ghost { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
.btn-secondary { background: #334155; border-color: #334155; color: #fff; }
.status { font-size: .88rem; margin: .35rem 0; min-height: 1.25em; font-weight: 600; }
.status.ok { color: var(--ok); } .status.err, .status.bad { color: var(--bad); } .status.info { color: var(--muted); }
.mcq-opts { display: flex; flex-direction: column; gap: .4rem; margin: .5rem 0; }
.mcq-opts label {
  display: flex; align-items: flex-start; gap: .5rem; background: #fff; border: 1px solid #cbd5e1;
  border-radius: 6px; padding: .5rem .7rem; cursor: pointer; font-size: .9rem;
}
.mcq-opts label:hover { border-color: #60a5fa; background: #f8fafc; }
.mcq-opts label.correct-mark { border-color: #10b981; background: #ecfdf5; }
.mcq-opts label.wrong-mark { border-color: #f87171; background: #fef2f2; }
.tt-fill { width: 100%; max-width: 420px; border-collapse: collapse; font-size: .9rem; margin: .5rem 0; }
.tt-fill th, .tt-fill td { border: 1px solid #94a3b8; padding: .4rem .5rem; text-align: center; }
.tt-fill th { background: #e2e8f0; }
.tt-fill button.bit, .kmap-grid button.kbit {
  appearance: none; min-width: 3rem; min-height: 2.2rem; padding: .25rem .4rem; font: inherit; font-weight: 700;
  border: 1px solid #60a5fa; border-radius: 4px; background: #fff; cursor: pointer; text-align: center;
}
.kmap-grid button.kbit.on { background: #dbeafe; color: #1e40af; }
.kmap-grid button.kbit.off { background: #f8fafc; color: #64748b; }
.tt-fill td.cell-ok, .kmap-grid td.cell-ok { background: #d1fae5; }
.tt-fill td.cell-bad, .kmap-grid td.cell-bad { background: #fecaca; }
.tt-fill td.cell-miss, .kmap-grid td.cell-miss { background: #fef3c7; }
.kmap-wrap { margin: .5rem 0; overflow-x: auto; }
.kmap-grid { border-collapse: collapse; font-size: .85rem; margin: .4rem 0; }
.kmap-grid th, .kmap-grid td { border: 1px solid #64748b; padding: .25rem; text-align: center; }
.kmap-grid th { background: #e2e8f0; font-weight: 700; font-size: .78rem; }
.kmap-grid th.kmap-corner { background: #f1f5f9; border: none; }
.kmap-hint { font-size: .78rem; color: #64748b; margin: .25rem 0 .5rem; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .65rem; margin: .8rem 0; }
.map-card {
  appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 10px;
  padding: .85rem .7rem; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
}
.map-card:hover:not(:disabled) { border-color: #60a5fa; box-shadow: 0 4px 14px rgba(37,99,235,.12); }
.map-card:disabled { opacity: .55; cursor: not-allowed; background: #f8fafc; }
.map-card .num { font-size: .72rem; font-weight: 800; color: var(--primary); }
.map-card .name { display: block; font-weight: 700; font-size: .88rem; margin: .25rem 0; }
.map-card .state { font-size: .72rem; color: var(--muted); }
.map-card.live .state { color: var(--ok); font-weight: 700; }
.progress-bar { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin: .6rem 0 1rem; }
.progress-bar > span { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#06b6d4); border-radius: 999px; }
.defs { margin: 0 0 .8rem; }
.defs dt { font-weight: 800; font-size: .86rem; margin-top: .45rem; color: #1e3a8a; }
.defs dd { margin: .15rem 0 .35rem; font-size: .86rem; color: #334155; line-height: 1.45; }
.hint-card { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .65rem; margin: .4rem 0; background: #fff; }
.hint-lab { font-size: .72rem; font-weight: 800; color: #b45309; margin-bottom: .2rem; }
.hint-card.locked { opacity: .65; background: #f1f5f9; }
.hint-card.open { border-color: #fdba74; background: #fffbeb; }
.laws-table { width: 100%; border-collapse: collapse; font-size: .82rem; margin: .5rem 0; }
.laws-table th, .laws-table td { border: 1px solid #94a3b8; padding: .35rem .45rem; text-align: left; vertical-align: top; }
.laws-table th { background: #e2e8f0; font-size: .75rem; }
.laws-table tr.hl td { background: #fef3c7; }
.laws-table .n { font-weight: 800; color: #1d4ed8; width: 2rem; text-align: center; }
.laws-note { background: #fff7ed; border-left: 4px solid #f59e0b; padding: .5rem .7rem; margin: .55rem 0; font-size: .88rem; }
.panel.right h3 { font-size: .9rem; margin: .85rem 0 .35rem; color: #1e40af; }
.muted { color: var(--muted); font-size: .84rem; }
.credit-muted { text-align: center; font-size: .68rem; color: var(--muted); padding: 0 .5rem .35rem; }
.footer-note { text-align: center; font-size: .72rem; color: var(--muted); padding: .25rem .5rem .7rem; }
.lightbox {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(15, 23, 42, .82);
  align-items: center; justify-content: center; padding: 1.2rem;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: min(96vw, 1100px); max-height: 90vh; width: auto; height: auto; object-fit: contain;
  background: #fff; border-radius: 10px; padding: .5rem; box-shadow: 0 20px 50px rgba(0,0,0,.45); cursor: zoom-out;
}
.lightbox .lb-close {
  position: absolute; top: 12px; right: 14px; appearance: none; border: 0; background: #fff; color: #0f172a;
  border-radius: 8px; padding: .4rem .75rem; font-weight: 800; font-size: .85rem; cursor: pointer;
}
.lightbox .lb-caption {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: #e2e8f0; font-size: .78rem; background: rgba(15,23,42,.65); padding: .3rem .7rem; border-radius: 999px;
}
@media (max-width: 960px) {
  .shell { flex-direction: column; height: auto; min-height: 0; }
  .panel.left, .panel.right { width: 100%; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
  .panel.mid { min-height: 360px; }
}

.fill-fields { display: flex; flex-direction: column; gap: .45rem; margin: .5rem 0; }
.fill-fields .fill-row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.fill-fields label { font-weight: 700; min-width: 4.5rem; font-size: .88rem; color: #1e3a8a; }
.fill-fields input, .fill-fields select {
  flex: 1; min-width: 10rem; padding: .45rem .6rem; border: 1px solid #94a3b8;
  border-radius: 8px; font-size: .92rem;
}
.fill-fields input:focus, .fill-fields select:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
.match-list { display: flex; flex-direction: column; gap: .45rem; margin: .5rem 0; }
.match-row { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; background: #fff;
  border: 1px solid #cbd5e1; border-radius: 8px; padding: .45rem .6rem; }
.match-row .m-left { flex: 1; min-width: 8rem; font-size: .9rem; font-weight: 650; }
.match-row select { min-width: 10rem; padding: .35rem .5rem; border-radius: 6px; border: 1px solid #94a3b8; }
.svg-fig { margin: .7rem 0; text-align: center; }
.svg-fig svg { max-width: 100%; height: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.koujue { background: #ecfdf5; border-left: 4px solid #10b981; padding: .55rem .75rem; margin: .65rem 0; font-size: .92rem; font-weight: 600; }
</style>
</head>
<body>
<header class="topbar">
  <h1>中四設計與應用科技科 · DAT</h1>
  <span class="tag" id="progressTag">進度 0</span>
  <button type="button" id="btnToggleLeft">隱藏目錄</button>
  <button type="button" id="btnToggleRight">隱藏支援</button>
  <button type="button" id="btnReset">重置進度</button>
</header>
<div class="shell">
  <aside class="panel left" aria-label="課程目錄">
    <div class="panel-h">課程項目</div>
    <div class="panel-body" id="navList"></div>
  </aside>
  <main class="panel mid" aria-label="教學與練習">
    <div class="panel-h">教學 · 練習視窗</div>
    <div class="panel-body" id="practiceBody"></div>
  </main>
  <aside class="panel right" aria-label="定義與支援">
    <div class="panel-h">定義 · 範例 · 提示</div>
    <div class="panel-body" id="supportBody"></div>
  </aside>
</div>
<p class="credit-muted" id="creditLine">校本自製示意圖 · DAT</p>
<p class="footer-note">離線可用 · 左目錄／中教學＋練習／右支援可摺疊 · 第 1–10 章上線（設計／人因／機械／結構／電子）· 自由選課</p>

<div class="lightbox" id="imgLightbox" aria-hidden="true" role="dialog" aria-label="放大圖片">
  <button type="button" class="lb-close" id="btnCloseLightbox">關閉</button>
  <img id="lightboxImg" src="" alt="放大圖">
  <div class="lb-caption">撳空白處或按 Esc 關閉</div>
</div>
<script src="lessons-data.js?v=20261027a"></script>
<script src="app.js?v=20261027a"></script>
</body>
</html>
